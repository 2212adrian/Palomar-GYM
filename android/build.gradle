// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// ─── SAFE KOTLIN RESOLUTION (PREVENTS DUPLICATE STDLIB CLASSES WITHOUT BREAKING COMPILER) ───
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // Only redirect legacy jdk7/jdk8 modules to prevent duplicate class collision,
            // never touch build-tools-impl or compiler internals.
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                }
            }
        }
    }
}

// ─── GLOBAL LINT SUPPRESSION (PREVENTS MISSING RESOURCE / SPLASH CRASHES) ───
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                lint {
                    abortOnError false
                    checkReleaseBuilds false
                }
            }
        }
    }
}